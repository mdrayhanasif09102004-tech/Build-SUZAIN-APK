<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SUZAIN App Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02051b;font-family:Arial,sans-serif;color:#fff}
.phone{width:min(430px,100vw);height:100vh;margin:auto;background:linear-gradient(#07154d,#05082a);overflow:hidden;position:relative}
.screen{height:calc(100% - 68px);overflow:auto;padding-bottom:20px}.screen::-webkit-scrollbar{display:none}
.header{height:62px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#07113feF;z-index:4;border-bottom:1px solid #21367e}
.logoText{font-weight:900;font-size:22px;letter-spacing:2px;background:linear-gradient(90deg,#00eaff,#b95cff);-webkit-background-clip:text;color:transparent}
.coin{font-size:12px;background:#101d50;border:1px solid #2de3ff;border-radius:20px;padding:8px 11px}
.pad{padding:14px 16px}.search{background:#0b1744;border:1px solid #284aa0;border-radius:25px;padding:12px;color:#91a8df}
.hero{margin-top:12px;padding:17px;border-radius:20px;background:linear-gradient(135deg,#0e42a6,#54158f);border:1px solid #2be7ff;box-shadow:0 0 25px #155dff44}
.hero img{width:72px;height:72px;border-radius:20px;object-fit:cover;float:right}h2{margin:0 0 6px;font-size:22px}p{color:#a9bde9;font-size:13px}
.btn{display:inline-block;padding:10px 18px;border-radius:22px;background:linear-gradient(90deg,#00dfff,#a338ff);font-weight:bold;font-size:13px}
.title{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.title h3{margin:0}.more{color:#45eaff;font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick{background:#0b1644;border:1px solid #243c88;border-radius:15px;padding:12px 4px;text-align:center;font-size:21px}.quick span{display:block;font-size:10px;color:#bdcbee;margin-top:5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#0a1540;border:1px solid #263e8d;border-radius:16px;padding:12px;min-height:85px}
.room{display:flex;gap:9px;align-items:center}.ava{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#13dfff,#7c39ff);font-size:22px}small{color:#9eb5e8}
.roomlist .card{margin-bottom:10px;min-height:78px}.roomlist .btn{float:right;margin-top:-30px;padding:7px 13px}
.feed{background:#09143e;border:1px solid #253e8b;border-radius:17px;margin-bottom:12px;overflow:hidden}.feed img{width:100%;height:155px;object-fit:cover;background:#101e51}.feed .txt{padding:12px}
.game{text-align:center;min-height:125px;background:linear-gradient(145deg,#0b194d,#281064);border-color:#4b37a8}.game .emoji{font-size:42px}
.profile{text-align:center;padding:18px}.profile .big{width:105px;height:105px;border-radius:50%;object-fit:cover;border:3px solid #2ee8ff;box-shadow:0 0 25px #2ee8ff66}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:15px 0;background:#09143d;border-radius:15px;padding:13px}.stats b,.stats span{display:block}.stats span{font-size:10px;color:#9fb2df;margin-top:4px}
.menu{background:#09143d;border:1px solid #233b85;border-radius:16px;overflow:hidden}.item{padding:15px;border-bottom:1px solid #1b2d65;display:flex;justify-content:space-between}.item:last-child{border:0}
.nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:#060b2cf5;border-top:1px solid #223777;display:grid;grid-template-columns:repeat(5,1fr);z-index:8}.nav button{border:0;background:none;color:#8295c5;font-size:10px}.nav button.active{color:#28e8ff}.nav i{display:block;font-style:normal;font-size:21px;margin:7px}
.roomtop{padding:15px;background:linear-gradient(135deg,#102c77,#37105c);text-align:center}.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding:20px 12px}.seat{text-align:center;font-size:10px;color:#b4c5ed}.seat .ava{margin:auto auto 5px;width:48px;height:48px}.roomchat{margin:0 12px;background:#08133b;border-radius:15px;padding:12px;height:170px;overflow:hidden}.bubble{font-size:11px;margin:7px 0;color:#d6e1ff}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 12px}.control{padding:12px;background:#101d4e;border-radius:16px;text-align:center}
</style>
</head>
<body>
<div class="phone">
<div id="app" class="screen"></div>
<div class="nav">
<button onclick="go('home')" id="n-home">⌂<br>Home</button>
<button onclick="go('rooms')" id="n-rooms">🎙<br>Rooms</button>
<button onclick="go('moments')" id="n-moments">◎<br>Moments</button>
<button onclick="go('games')" id="n-games">🎮<br>Games</button>
<button onclick="go('me')" id="n-me">👤<br>Me</button>
</div></div>
